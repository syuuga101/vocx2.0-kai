<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vocx" />
  <meta name="theme-color" content="#ff6262" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./sys/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./sys/apple-touch-icon.png" />
  <title>Vocx &amp; Dojo</title>
  <style>
    @font-face {
      font-family: 'ABCGintoDiscordNord';
      src: url('./sys/ABCGintoDiscordNord-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'MPLUS1-Bold';
      src: url('./sys/MPLUS1-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'MPLUS1-Black';
      src: url('./sys/MPLUS1-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-coral: #ff6262;
      --bg-dark: #2c2c2c;
      --surface-btn: #4f4f4f;
      --border-grey: #919191;
      --pink-accent: #ff9696;
      --pink-shadow: #dd7d7d;
      --green-ring: #5bf067;
      --green-shadow: #58c34c;
      --yellow-ring: #f6ff78;
      --yellow-shadow: #cad16d;
      --progress-fill: #ffd362;
      --progress-thumb: #fff7e3;
      --text-light: #eaeaea;
      --text-white: #ffffff;
      --text-cream: #fff5f5;
      --avatar-teal: #5db4b6;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --app-height: 100dvh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html {
      width: 100%;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      background-color: var(--bg-coral);
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      background-color: var(--bg-coral);
      font-family: 'ABCGintoDiscordNord', 'MPLUS1-Bold', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: stretch;
      justify-content: center;
      overscroll-behavior: none;
    }

    /* WebKit top fixed container edge strip to suppress iOS 26/27 status bar blur pocket */
    .ios-blur-fix {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 12px;
      padding-top: env(safe-area-inset-top, 0px);
      z-index: 2147483647;
      pointer-events: none;
      background-color: #ff6262;
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* App Container:
       - No phone frame/bezel.
       - Portrait viewports: full-bleed covering top & bottom safe areas with overflow locked.
       - Landscape / PC viewports: full-height vertical column centered horizontally. */
    #phone-viewport {
      position: relative;
      width: 100%;
      height: var(--app-height, 100dvh);
      background-color: var(--bg-coral);
      overflow: hidden;
    }

    @media (min-aspect-ratio: 4/5) and (min-width: 520px) {
      html, body {
        background-color: #1e1e1e;
      }
      #phone-viewport {
        height: 100dvh;
        width: clamp(340px, 46dvh, 420px);
        max-width: 100vw;
        overflow: hidden;
      }
    }

    @media (max-aspect-ratio: 4/5), (max-width: 519px) {
      html, body {
        background-color: var(--bg-coral);
      }
      #phone-viewport {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: var(--app-height, 100dvh);
        overflow: hidden;
      }
    }

    /* Screen Layers */
    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      background-color: var(--bg-coral);
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    /* Header Title (Vocx / Dojo)
       Placed below the iOS status-bar blur zone (safe-top + 42px) with pure #ff6262 above it,
       so blurring uniform #ff6262 produces flat #ff6262 and "Vocx" is 100% crisp. */
    .app-header {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      padding-top: max(calc(var(--safe-top) + 42px), 38px);
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background-color: var(--bg-coral);
      touch-action: none;
    }

    .app-title-btn {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 34px;
      color: var(--bg-dark);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 18px;
      border-radius: 18px;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
      position: relative;
    }

    .app-title-btn:active {
      transform: scale(0.92);
    }

    .app-title-btn.flip-anim {
      animation: titleFlip 0.28s ease;
    }

    @keyframes titleFlip {
      0% { transform: scale(1) translateY(0); opacity: 1; }
      45% { transform: scale(0.86) translateY(-4px); opacity: 0.35; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Home Screen Units Scroll Area (strictly clipped below .app-header) */
    .units-scroll {
      position: relative;
      flex: 1;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      touch-action: pan-y;
      padding-top: 8px;
      padding-bottom: calc(96px + var(--safe-bottom));
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }

    .units-scroll::-webkit-scrollbar {
      display: none;
    }

    .units-list {
      position: relative;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Vertical connecting timeline bar behind circles (centered at 32px + 76px/2 = 70px) */
    .timeline-line {
      position: absolute;
      left: 66px;
      top: 14px;
      bottom: 20px;
      width: 8px;
      background-color: var(--pink-accent);
      z-index: 1;
      border-radius: 4px;
    }

    .unit-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      padding-left: 32px;
      padding-right: 18px;
      min-height: 82px;
    }

    /* Left Circle (問題番号) - Shadow directly underneath (真下) */
    .unit-circle-wrap {
      position: relative;
      width: 76px;
      height: 82px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .unit-circle-wrap.pressing .unit-circle-main {
      transform: translateY(3px);
    }

    .unit-info-wrap.pressing {
      transform: scale(0.94);
    }

    .unit-circle-wrap.long-triggered,
    .unit-info-wrap.long-triggered {
      animation: pulsePop 0.32s ease;
    }

    @keyframes pulsePop {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .unit-circle-shadow {
      position: absolute;
      left: 0;
      top: 5.5px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background-color: var(--pink-shadow);
      transition: background-color 0.2s ease;
    }

    .unit-circle-main {
      position: absolute;
      left: 0;
      top: 0;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background-color: var(--bg-dark);
      border: 6px solid var(--pink-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, transform 0.12s ease;
    }

    .unit-circle-num {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 25px;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1;
      letter-spacing: -0.5px;
    }

    /* Status themes for Unit Circle */
    .unit-row[data-status="marvelous"] .unit-circle-shadow,
    .unit-row[data-status="perfect"] .unit-circle-shadow {
      background-color: var(--green-shadow);
    }
    .unit-row[data-status="marvelous"] .unit-circle-main,
    .unit-row[data-status="perfect"] .unit-circle-main {
      border-color: var(--green-ring);
    }

    .unit-row[data-status="nice"] .unit-circle-shadow {
      background-color: var(--yellow-shadow);
    }
    .unit-row[data-status="nice"] .unit-circle-main {
      border-color: var(--yellow-ring);
    }

    .unit-row[data-status="paused"] .unit-circle-shadow,
    .unit-row[data-status="untried"] .unit-circle-shadow {
      background-color: var(--pink-shadow);
    }
    .unit-row[data-status="paused"] .unit-circle-main,
    .unit-row[data-status="untried"] .unit-circle-main {
      border-color: var(--pink-accent);
    }

    /* Badge at top-right of circle (Check / Pause) */
    .unit-badge {
      position: absolute;
      left: 52px;
      top: -3px;
      width: 26px;
      height: 26px;
      z-index: 4;
      pointer-events: none;
    }

    /* Right Text Group (Unit番号) */
    .unit-info-wrap {
      margin-left: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 14px;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .unit-title-text {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 23px;
      font-weight: 700;
      line-height: 30px;
      color: var(--bg-dark);
      white-space: nowrap;
    }

    .unit-status-text {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      line-height: 19px;
      color: var(--bg-dark);
      margin-left: 2px;
      margin-top: 1px;
    }

    /* Mypage Screen */
    .mypage-body {
      flex: 1;
      width: 100%;
      padding-top: 18px;
      padding-left: 18px;
      padding-right: 18px;
      padding-bottom: calc(96px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }

    .mypage-card {
      width: 100%;
      max-width: 332px;
      min-height: 292px;
      background-color: var(--bg-dark);
      border-radius: 34px;
      padding: 24px 22px 26px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    .profile-row {
      display: flex;
      align-items: center;
      padding-left: 4px;
      gap: 16px;
    }

    .profile-avatar-wrap {
      position: relative;
      width: 78px;
      height: 78px;
      flex-shrink: 0;
    }

    .profile-avatar {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background-color: var(--avatar-teal);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .profile-edit-btn {
      position: absolute;
      left: 53px;
      top: 0px;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
      transition: transform 0.15s ease;
    }

    .profile-edit-btn:active {
      transform: scale(0.9);
    }

    .profile-name {
      font-family: 'ABCGintoDiscordNord', 'MPLUS1-Bold', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-cream);
      cursor: pointer;
      word-break: break-all;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 26px;
      gap: 12px;
    }

    .setting-label {
      font-family: 'MPLUS1-Bold', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-cream);
      line-height: 24px;
    }

    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      width: 52px;
      height: 26px;
      border-radius: 34px;
      background-color: var(--border-grey);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .toggle-switch.on {
      background-color: var(--green-shadow);
    }

    .toggle-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: #d9d9d9;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toggle-switch.on .toggle-thumb {
      transform: translateX(26px);
    }

    /* Bottom Footer Navigation (Home & Mypage) - Grounded flush to the physical bottom, non-scrollable */
    .bottom-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: calc(60px + var(--safe-bottom));
      background-color: var(--bg-dark);
      border-radius: 40px 40px 0 0;
      z-index: 30;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 15px 28% calc(12px + var(--safe-bottom)) 28%;
      touch-action: none;
    }

    .nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .nav-btn svg {
      width: 29px;
      height: 31px;
    }

    .nav-btn:active {
      transform: scale(0.9);
    }

    /* Quiz Screen */
    #screen-quiz {
      z-index: 40;
    }

    .quiz-topbar {
      position: absolute;
      top: max(calc(var(--safe-top) + 40px), 34px);
      left: 22px;
      right: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 2;
      touch-action: none;
    }

    .quiz-close-btn {
      width: 22px;
      height: 22px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .quiz-close-btn:active {
      transform: scale(0.88);
    }

    .quiz-progress-track {
      position: relative;
      flex: 1;
      max-width: 225px;
      height: 18px;
      border-radius: 12px;
      background-color: var(--pink-accent);
      overflow: visible;
    }

    .quiz-progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 18px;
      border-radius: 12px;
      background-color: var(--progress-fill);
      transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quiz-progress-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--progress-thumb);
      transition: left 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quiz-unit-num {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--bg-dark);
      min-width: 22px;
      text-align: center;
      flex-shrink: 0;
    }

    /* Quiz Draggable Main Dark Card - Grounded flush to the physical bottom */
    .quiz-sheet {
      position: absolute;
      left: 0;
      right: 0;
      top: max(calc(var(--safe-top) + 76px), 70px);
      bottom: 0;
      padding-bottom: var(--safe-bottom);
      background-color: var(--bg-dark);
      border-radius: 44px 44px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      touch-action: none;
    }

    .quiz-sheet.dragging {
      transition: none;
    }

    .quiz-pause-handle-area {
      width: 100%;
      height: 32px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 11px;
      cursor: grab;
      flex-shrink: 0;
    }

    .quiz-pause-pill {
      width: 38px;
      height: 7px;
      border-radius: 5px;
      background-color: var(--surface-btn);
    }

    /* Quiz Content Container */
    .quiz-content {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 22px 118px 22px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .quiz-content::-webkit-scrollbar {
      display: none;
    }

    /* Question Prompt Text Styles */
    .quiz-prompt-jpn {
      margin-top: clamp(14px, 3.8dvh, 32px);
      width: 100%;
      max-width: 296px;
      font-family: 'MPLUS1-Black', 'MPLUS1-Bold', sans-serif;
      font-size: 25px;
      font-weight: 900;
      color: var(--text-light);
      text-align: center;
      line-height: 1.35;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-prompt-eng-select {
      margin-top: clamp(20px, 5.2dvh, 46px);
      width: 100%;
      max-width: 292px;
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-light);
      text-align: center;
      line-height: 1.42;
      min-height: clamp(68px, 10.5dvh, 94px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-prompt-dojo-stack {
      margin-top: clamp(14px, 3.4dvh, 28px);
      width: 100%;
      max-width: 296px;
      font-family: 'MPLUS1-Black', 'ABCGintoDiscordNord', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: var(--text-light);
      text-align: center;
      line-height: 1.35;
      min-height: clamp(70px, 11.5dvh, 100px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-prompt-type-wrap {
      margin-top: clamp(14px, 4.5dvh, 42px);
      width: 100%;
      max-width: 296px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 3dvh, 26px);
    }

    .quiz-prompt-type-sentence {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-light);
      text-align: center;
      line-height: 1.45;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-prompt-type-def {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-light);
      text-align: center;
      line-height: 1.45;
      width: 100%;
      max-width: 280px;
    }

    /* Choice Button Layouts */
    /* 1) 4 Stacked Buttons (JPN-ENG) */
    .choices-stack-4 {
      margin-top: clamp(14px, 3.6dvh, 30px);
      width: 100%;
      max-width: 292px;
      display: flex;
      flex-direction: column;
      gap: clamp(13px, 3dvh, 26px);
    }

    /* 2) 3 Stacked Buttons (Dojo Part 1 Sec 2) */
    .choices-stack-3 {
      margin-top: clamp(14px, 2.8dvh, 24px);
      width: 100%;
      max-width: 292px;
      display: flex;
      flex-direction: column;
      gap: clamp(15px, 3dvh, 26px);
    }

    /* 3) 2 Stacked Buttons (Dojo Part 2 Phrasal Verbs) */
    .choices-stack-2 {
      margin-top: clamp(20px, 4.2dvh, 38px);
      width: 100%;
      max-width: 292px;
      display: flex;
      flex-direction: column;
      gap: clamp(18px, 3.6dvh, 32px);
    }

    /* 4) 2x2 Grid Buttons (ENG-ENG Select & Dojo Part 1 Sec 1) */
    .choices-grid-4 {
      margin-top: clamp(30px, 9.5dvh, 84px);
      width: 100%;
      max-width: 306px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      column-gap: 10px;
      row-gap: 15px;
    }

    /* Pill Choice Button Base - Shadows strictly directly underneath (0px X-offset) */
    .choice-btn {
      position: relative;
      width: 100%;
      background-color: var(--surface-btn);
      border: 2.5px solid var(--border-grey);
      border-radius: 100px;
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      text-align: center;
      transition: transform 0.1s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .choices-stack-4 .choice-btn,
    .choices-stack-3 .choice-btn,
    .choices-stack-2 .choice-btn {
      height: 51px;
      box-shadow: 0 5px 0 var(--border-grey);
    }

    .choices-stack-4 .choice-btn {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 21px;
      font-weight: 700;
    }

    .choices-stack-2 .choice-btn {
      font-family: 'MPLUS1-Black', 'ABCGintoDiscordNord', sans-serif;
      font-size: 21px;
      font-weight: 900;
    }

    .choices-stack-3 .choice-btn {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
    }

    .choices-grid-4 .choice-btn {
      height: 50px;
      border-radius: 48px;
      box-shadow: 0 3.5px 0 var(--border-grey);
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.25;
      padding: 5px 9px;
    }

    .choice-btn:active {
      transform: translateY(2.5px);
    }

    .choices-stack-4 .choice-btn:active,
    .choices-stack-3 .choice-btn:active,
    .choices-stack-2 .choice-btn:active {
      box-shadow: 0 2.5px 0 var(--border-grey);
    }

    .choices-grid-4 .choice-btn:active {
      box-shadow: 0 1px 0 var(--border-grey);
    }

    .choice-btn.selected {
      border-color: var(--pink-accent);
      box-shadow: 0 5px 0 var(--pink-accent);
    }

    .choices-grid-4 .choice-btn.selected {
      border-color: var(--pink-accent);
      box-shadow: 0 3.5px 0 var(--pink-accent);
    }

    /* ENG-ENG Type Input Field (uses native system keyboard) */
    .type-input-box {
      margin-top: clamp(16px, 4.2dvh, 38px);
      width: 100%;
      max-width: 292px;
      height: 46px;
      border-radius: 34px;
      background-color: var(--surface-btn);
      border: 2.5px solid var(--border-grey);
      box-shadow: 0 3.5px 0 var(--border-grey);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 16px;
      cursor: text;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .type-input-box:focus-within {
      border-color: var(--pink-accent);
      box-shadow: 0 3.5px 0 var(--pink-accent);
    }

    .type-native-input {
      flex: 1;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'ABCGintoDiscordNord', 'MPLUS1-Bold', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-white);
      caret-color: var(--pink-accent);
      user-select: text;
      -webkit-user-select: text;
      padding-right: 8px;
    }

    .type-submit-btn {
      width: 33px;
      height: 33px;
      border-radius: 50%;
      background-color: var(--pink-accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.12s ease;
    }

    .type-submit-btn:active {
      transform: scale(0.9);
    }

    /* Slide to Next Slider */
    .slide-next-wrap {
      position: absolute;
      left: 32px;
      right: 32px;
      max-width: 292px;
      margin: 0 auto;
      bottom: calc(clamp(20px, 5.2dvh, 46px) + var(--safe-bottom));
      height: 60px;
      border-radius: 58px;
      background-color: var(--surface-btn);
      border: 2.5px solid var(--border-grey);
      box-shadow: 0 3.5px 0 var(--border-grey);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 8;
    }

    .slide-next-label {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-light);
      margin-left: 28px;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .slide-next-thumb {
      position: absolute;
      left: -1.5px;
      top: -2.5px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--pink-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide-next-thumb.dragging {
      transition: none;
      cursor: grabbing;
    }

    /* Check Bottom Sheet (5:799 / 5:777) */
    .check-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      touch-action: none;
    }

    .check-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .check-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: calc(238px + var(--safe-bottom));
      background-color: var(--bg-dark);
      border-radius: 44px 44px 0 0;
      box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.55);
      padding: 25px 24px calc(28px + var(--safe-bottom)) 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      z-index: 55;
      transform: translateY(105%);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      touch-action: none;
    }

    .check-sheet.open {
      transform: translateY(0);
    }

    .check-status-title {
      font-family: 'MPLUS1-Black', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--text-light);
      line-height: 29px;
      text-align: center;
    }

    .check-status-title.wrong {
      color: var(--pink-accent);
    }

    .check-answer-word {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 25px;
      font-weight: 700;
      color: var(--text-light);
      text-align: center;
      line-height: 1.25;
      margin-top: 4px;
      word-break: break-word;
    }

    .check-answer-sub {
      font-family: 'MPLUS1-Bold', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-light);
      text-align: center;
      line-height: 1.45;
      margin-top: 6px;
      max-width: 290px;
    }

    .check-next-btn {
      margin-top: 15px;
      width: 138px;
      height: 50px;
      border-radius: 48px;
      background-color: var(--surface-btn);
      border: 2.5px solid var(--border-grey);
      box-shadow: 0 3.5px 0 var(--border-grey);
      font-family: 'MPLUS1-Bold', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .check-next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1.5px 0 var(--border-grey);
    }

    /* Quit Confirmation Modal (5:763 / 14:411) */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      touch-action: none;
    }

    .modal-overlay.open {
      display: flex;
    }

    .quit-modal-card {
      width: 316px;
      max-width: 100%;
      min-height: 212px;
      background-color: var(--bg-dark);
      border-radius: 34px;
      padding: 40px 14px 22px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
      animation: modalPop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalPop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .quit-modal-text {
      padding: 0 22px;
      font-family: 'MPLUS1-Bold', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-light);
      line-height: 1.44;
      text-align: left;
    }

    .quit-modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 26px;
    }

    .quit-modal-btn {
      flex: 1;
      max-width: 138px;
      height: 50px;
      border-radius: 48px;
      background-color: var(--surface-btn);
      border: 2.5px solid var(--border-grey);
      box-shadow: 0 3.5px 0 var(--border-grey);
      font-family: 'MPLUS1-Bold', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .quit-modal-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1.5px 0 var(--border-grey);
    }

    /* Name Edit Modal */
    .name-input-field {
      width: 100%;
      height: 42px;
      border-radius: 21px;
      background-color: var(--surface-btn);
      border: 2.5px solid var(--border-grey);
      color: var(--text-white);
      font-family: 'ABCGintoDiscordNord', 'MPLUS1-Bold', sans-serif;
      font-size: 16px;
      padding: 0 16px;
      outline: none;
      margin-top: 12px;
      user-select: text;
      -webkit-user-select: text;
    }

    .name-input-field:focus {
      border-color: var(--pink-accent);
    }

    /* Subtle mode toast pill */
    .mode-toast {
      position: absolute;
      top: max(calc(var(--safe-top) + 84px), 78px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'ABCGintoDiscordNord', 'MPLUS1-Bold', sans-serif;
      font-size: 11.5px;
      padding: 4px 12px;
      border-radius: 20px;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .mode-toast.show {
      opacity: 0.92;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="ios-blur-fix" class="ios-blur-fix" aria-hidden="true"></div>

      <!-- Bottom Navigation Bar -->
      <footer class="bottom-footer">
        <button id="nav-home-btn" class="nav-btn" type="button" aria-label="Home">
          <!-- Home Active SVG -->

    </div>

    <!-- ==================== QUIZ SCREEN LAYER ==================== -->
    <div id="screen-quiz" class="screen">
      <!-- Topbar: Close X, Progress Slider, Unit Number -->
      <div class="quiz-topbar">
        <button id="quiz-close-btn" class="quiz-close-btn" type="button" aria-label="Quit Quiz">
          <svg width="20" height="20" viewBox="0 0 27 27" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24.7499 2.25001L2.24995 24.75M2.24995 2.25001L24.7499 24.75" stroke="#2C2C2C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

        </button>

          <div id="quiz-progress-fill" class="quiz-progress-fill"></div>
          <div id="quiz-progress-thumb" class="quiz-progress-thumb"></div>

        </div>

        </div>

        <!-- Slide to Next Slider (shown for choice modes) -->
        <div id="slide-next-wrap" class="slide-next-wrap">
          <span class="slide-next-label">Slide to Next</span>
          <div id="slide-next-thumb" class="slide-next-thumb">
            <svg width="15" height="13" viewBox="0 0 18 15" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- Check Bottom Sheet (5:799 / 5:777) -->
      <div id="check-backdrop" class="check-backdrop"></div>
      <div id="check-sheet" class="check-sheet">
        <div id="check-status-title" class="check-status-title">すごい！</div>
        <div id="check-answer-word" class="check-answer-word">Agreement</div>
        <div id="check-answer-sub" class="check-answer-sub">合意・契約</div>
        <button id="check-next-btn" class="check-next-btn" type="button">進む</button>
      </div>
    </div>

    <!-- ==================== QUIT CONFIRMATION MODAL (5:763 / 14:411) ==================== -->
    <div id="quit-modal" class="modal-overlay">
      <div class="quit-modal-card">
        <div class="quit-modal-text">終了しますか？<br/>進捗状況は破棄されます。</div>
        <div class="quit-modal-actions">
          <button id="quit-confirm-yes" class="quit-modal-btn" type="button">はい</button>
          <button id="quit-confirm-no" class="quit-modal-btn" type="button">いいえ</button>
        </div>
      </div>

    <!-- ==================== PROFILE NAME EDIT MODAL ==================== -->
    <div id="name-modal" class="modal-overlay">
      <div class="quit-modal-card" style="min-height: 230px; padding-top: 36px;">
