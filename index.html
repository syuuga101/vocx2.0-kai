<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff6262" />
  <title>Vocx &amp; Dojo</title>
  <style>
    @font-face {
      font-family: 'ABCGintoDiscordNord';
      src: url('./sys/ABCGintoDiscordNord-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'MPLUS1-Bold';
      src: url('./sys/MPLUS1-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'MPLUS1-Black';
      src: url('./sys/MPLUS1-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-coral: #ff6262;
      --bg-dark: #2c2c2c;
      --surface-btn: #4f4f4f;
      --border-grey: #919191;
      --pink-accent: #ff9696;
      --pink-shadow: #dd7d7d;
      --green-ring: #5bf067;
      --green-shadow: #58c34c;
      --yellow-ring: #f6ff78;
      --yellow-shadow: #cad16d;
      --progress-fill: #ffd362;
      --progress-thumb: #fff7e3;
      --text-light: #eaeaea;
      --text-white: #ffffff;
      --text-cream: #fff5f5;
      --avatar-teal: #5db4b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1e1e1e;
      font-family: 'ABCGintoDiscordNord', 'MPLUS1-Bold', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overscroll-behavior: none;
    }

    /* App Container:
       - No phone frame/bezel.
       - Portrait viewports: full-screen (100vw x 100dvh), flexibly responsive.
       - Landscape / PC viewports: full-height vertical screen centered horizontally. */
    #phone-viewport {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background-color: var(--bg-coral);
      overflow: hidden;
    }

    @media (min-aspect-ratio: 4/5) and (min-width: 520px) {
      #phone-viewport {
        height: 100dvh;
        width: clamp(360px, 52dvh, 480px);
        max-width: 100vw;
      }
    }

    @media (max-aspect-ratio: 4/5), (max-width: 519px) {
      html, body {
        background-color: var(--bg-coral);
      }
      #phone-viewport {
        width: 100vw;
        height: 100dvh;
      }
    }

    /* Screen Layers */
    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      background-color: var(--bg-coral);
    }

    .screen.active {
      display: flex;
    }

    /* Header Title (Vocx / Dojo) */
    .app-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: clamp(92px, 15.5dvh, 136px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      z-index: 20;
      background: linear-gradient(180deg, var(--bg-coral) 82%, rgba(255, 98, 98, 0) 100%);
      pointer-events: none;
    }

    .app-title-btn {
      pointer-events: auto;
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 48px;
      color: var(--bg-dark);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 20px;
      border-radius: 20px;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
      position: relative;
    }

    .app-title-btn:active {
      transform: scale(0.92);
    }

    .app-title-btn.flip-anim {
      animation: titleFlip 0.28s ease;
    }

    @keyframes titleFlip {
      0% { transform: scale(1) translateY(0); opacity: 1; }
      45% { transform: scale(0.86) translateY(-4px); opacity: 0.35; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Home Screen Units Scroll Area */
    .units-scroll {
      position: relative;
      flex: 1;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: clamp(104px, 17.5dvh, 149px);
      padding-bottom: clamp(115px, 16.5dvh, 145px);
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }

    .units-scroll::-webkit-scrollbar {
      display: none;
    }

    .units-list {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* Vertical connecting timeline bar behind circles (centered at 31px + 107px/2 = 84.5px) */
    .timeline-line {
      position: absolute;
      left: 79px;
      top: 16px;
      bottom: 24px;
      width: 11px;
      background-color: var(--pink-accent);
      z-index: 1;
      border-radius: 6px;
    }

    .unit-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      padding-left: 31px;
      padding-right: 20px;
      min-height: 114px;
    }

    /* Left Circle (問題番号) - Shadow directly underneath (真下) */
    .unit-circle-wrap {
      position: relative;
      width: 107px;
      height: 114px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .unit-circle-wrap.pressing .unit-circle-main {
      transform: translateY(4px);
    }

    .unit-info-wrap.pressing {
      transform: scale(0.94);
    }

    .unit-circle-wrap.long-triggered,
    .unit-info-wrap.long-triggered {
      animation: pulsePop 0.32s ease;
    }

    @keyframes pulsePop {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .unit-circle-shadow {
      position: absolute;
      left: 0;
      top: 7px;
      width: 107px;
      height: 107px;
      border-radius: 50%;
      background-color: var(--pink-shadow);
      transition: background-color 0.2s ease;
    }

    .unit-circle-main {
      position: absolute;
      left: 0;
      top: 0;
      width: 107px;
      height: 107px;
      border-radius: 50%;
      background-color: var(--bg-dark);
      border: 8px solid var(--pink-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, transform 0.12s ease;
    }

    .unit-circle-num {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1;
      letter-spacing: -0.5px;
    }

    /* Status themes for Unit Circle */
    .unit-row[data-status="marvelous"] .unit-circle-shadow,
    .unit-row[data-status="perfect"] .unit-circle-shadow {
      background-color: var(--green-shadow);
    }
    .unit-row[data-status="marvelous"] .unit-circle-main,
    .unit-row[data-status="perfect"] .unit-circle-main {
      border-color: var(--green-ring);
    }

    .unit-row[data-status="nice"] .unit-circle-shadow {
      background-color: var(--yellow-shadow);
    }
    .unit-row[data-status="nice"] .unit-circle-main {
      border-color: var(--yellow-ring);
    }

    .unit-row[data-status="paused"] .unit-circle-shadow,
    .unit-row[data-status="untried"] .unit-circle-shadow {
      background-color: var(--pink-shadow);
    }
    .unit-row[data-status="paused"] .unit-circle-main,
    .unit-row[data-status="untried"] .unit-circle-main {
      border-color: var(--pink-accent);
    }

    /* Badge at top-right of circle (Check / Pause) */
    .unit-badge {
      position: absolute;
      left: 73px;
      top: -4px;
      width: 31px;
      height: 31px;
      z-index: 4;
      pointer-events: none;
    }

    /* Right Text Group (Unit番号) */
    .unit-info-wrap {
      margin-left: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 16px;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .unit-title-text {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 36px;
      font-weight: 700;
      line-height: 46px;
      color: var(--bg-dark);
      white-space: nowrap;
    }

    .unit-status-text {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 24px;
      color: var(--bg-dark);
      margin-left: 3px;
      margin-top: 1px;
    }

    /* Mypage Screen */
    .mypage-body {
      flex: 1;
      width: 100%;
      padding-top: clamp(116px, 19.5dvh, 166px);
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: clamp(110px, 15dvh, 130px);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }

    .mypage-card {
      width: 100%;
      max-width: 380px;
      min-height: 365.5px;
      background-color: var(--bg-dark);
      border-radius: 40px;
      padding: 32px 28px 34px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 32px;
    }

    .profile-row {
      display: flex;
      align-items: center;
      padding-left: 5px;
      gap: 22px;
    }

    .profile-avatar-wrap {
      position: relative;
      width: 101px;
      height: 101px;
      flex-shrink: 0;
    }

    .profile-avatar {
      width: 101px;
      height: 101px;
      border-radius: 50%;
      background-color: var(--avatar-teal);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .profile-edit-btn {
      position: absolute;
      left: 68px;
      top: 0px;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
      transition: transform 0.15s ease;
    }

    .profile-edit-btn:active {
      transform: scale(0.9);
    }

    .profile-name {
      font-family: 'ABCGintoDiscordNord', 'MPLUS1-Bold', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-cream);
      cursor: pointer;
      word-break: break-all;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      gap: 12px;
    }

    .setting-label {
      font-family: 'MPLUS1-Bold', sans-serif;
      font-size: 21.25px;
      font-weight: 700;
      color: var(--text-cream);
      line-height: 31px;
    }

    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      width: 65px;
      height: 32px;
      border-radius: 39px;
      background-color: var(--border-grey);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .toggle-switch.on {
      background-color: var(--green-shadow);
    }

    .toggle-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #d9d9d9;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toggle-switch.on .toggle-thumb {
      transform: translateX(33px);
    }

    /* Bottom Footer Navigation (Home & Mypage) */
    .bottom-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: clamp(92px, 13.5dvh, 115px);
      background-color: var(--bg-dark);
      border-radius: 55px 55px 0 0;
      z-index: 30;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: clamp(18px, 3dvh, 25px) 28% 0 28%;
    }

    .nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .nav-btn:active {
      transform: scale(0.9);
    }

    /* Quiz Screen */
    #screen-quiz {
      z-index: 40;
    }

    .quiz-topbar {
      position: absolute;
      top: clamp(36px, 9dvh, 78px);
      left: 24px;
      right: 27px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      z-index: 2;
    }

    .quiz-close-btn {
      width: 26px;
      height: 26px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .quiz-close-btn:active {
      transform: scale(0.88);
    }

    .quiz-progress-track {
      position: relative;
      flex: 1;
      max-width: 260px;
      height: 22px;
      border-radius: 15px;
      background-color: var(--pink-accent);
      overflow: visible;
    }

    .quiz-progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 22px;
      border-radius: 15px;
      background-color: var(--progress-fill);
      transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quiz-progress-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: var(--progress-thumb);
      transition: left 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quiz-unit-num {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--bg-dark);
      min-width: 25px;
      text-align: center;
      flex-shrink: 0;
    }

    /* Quiz Draggable Main Dark Card */
    .quiz-sheet {
      position: absolute;
      left: 0;
      right: 0;
      top: clamp(86px, 16.8dvh, 144px);
      bottom: 0;
      background-color: var(--bg-dark);
      border-radius: 55px 55px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      touch-action: none;
    }

    .quiz-sheet.dragging {
      transition: none;
    }

    .quiz-pause-handle-area {
      width: 100%;
      height: 38px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 13px;
      cursor: grab;
      flex-shrink: 0;
    }

    .quiz-pause-pill {
      width: 44px;
      height: 8px;
      border-radius: 5px;
      background-color: var(--surface-btn);
    }

    /* Quiz Content Container */
    .quiz-content {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 140px 24px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .quiz-content::-webkit-scrollbar {
      display: none;
    }

    /* Question Prompt Text Styles */
    .quiz-prompt-jpn {
      margin-top: clamp(18px, 4.5dvh, 40px);
      width: 100%;
      max-width: 340px;
      font-family: 'MPLUS1-Black', 'MPLUS1-Bold', sans-serif;
      font-size: 30px;
      font-weight: 900;
      color: var(--text-light);
      text-align: center;
      line-height: 1.35;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-prompt-eng-select {
      margin-top: clamp(24px, 6.2dvh, 56px);
      width: 100%;
      max-width: 330px;
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-light);
      text-align: center;
      line-height: 1.42;
      min-height: clamp(80px, 12.5dvh, 110px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-prompt-dojo-stack {
      margin-top: clamp(16px, 4dvh, 34px);
      width: 100%;
      max-width: 340px;
      font-family: 'MPLUS1-Black', 'ABCGintoDiscordNord', sans-serif;
      font-size: 27px;
      font-weight: 900;
      color: var(--text-light);
      text-align: center;
      line-height: 1.35;
      min-height: clamp(84px, 13.5dvh, 120px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-prompt-type-wrap {
      margin-top: clamp(18px, 5.5dvh, 52px);
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(16px, 3.5dvh, 32px);
    }

    .quiz-prompt-type-sentence {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-light);
      text-align: center;
      line-height: 1.45;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-prompt-type-def {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-light);
      text-align: center;
      line-height: 1.45;
      width: 100%;
      max-width: 320px;
    }

    /* Choice Button Layouts */
    /* 1) 4 Stacked Buttons (JPN-ENG) */
    .choices-stack-4 {
      margin-top: clamp(18px, 4.2dvh, 36px);
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 3.6dvh, 32px);
    }

    /* 2) 3 Stacked Buttons (Dojo Part 1 Sec 2) */
    .choices-stack-3 {
      margin-top: clamp(16px, 3.2dvh, 28px);
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: clamp(18px, 3.6dvh, 32px);
    }

    /* 3) 2 Stacked Buttons (Dojo Part 2 Phrasal Verbs) */
    .choices-stack-2 {
      margin-top: clamp(24px, 5dvh, 46px);
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: clamp(22px, 4.2dvh, 38px);
    }

    /* 4) 2x2 Grid Buttons (ENG-ENG Select & Dojo Part 1 Sec 1) */
    .choices-grid-4 {
      margin-top: clamp(36px, 11dvh, 102px);
      width: 100%;
      max-width: 356px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      column-gap: 12px;
      row-gap: 18.4px;
    }

    /* Pill Choice Button Base - Shadows strictly directly underneath (0px X-offset) */
    .choice-btn {
      position: relative;
      width: 100%;
      background-color: var(--surface-btn);
      border: 3px solid var(--border-grey);
      border-radius: 100px;
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      text-align: center;
      transition: transform 0.1s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .choices-stack-4 .choice-btn,
    .choices-stack-3 .choice-btn,
    .choices-stack-2 .choice-btn {
      height: 60px;
      box-shadow: 0 6px 0 var(--border-grey);
    }

    .choices-stack-4 .choice-btn {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 25px;
      font-weight: 700;
    }

    .choices-stack-2 .choice-btn {
      font-family: 'MPLUS1-Black', 'ABCGintoDiscordNord', sans-serif;
      font-size: 25px;
      font-weight: 900;
    }

    .choices-stack-3 .choice-btn {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .choices-grid-4 .choice-btn {
      height: 58.7px;
      border-radius: 55.8px;
      box-shadow: 0 4px 0 var(--border-grey);
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      padding: 6px 10px;
    }

    .choice-btn:active {
      transform: translateY(3px);
    }

    .choices-stack-4 .choice-btn:active,
    .choices-stack-3 .choice-btn:active,
    .choices-stack-2 .choice-btn:active {
      box-shadow: 0 3px 0 var(--border-grey);
    }

    .choices-grid-4 .choice-btn:active {
      box-shadow: 0 1px 0 var(--border-grey);
    }

    .choice-btn.selected {
      border-color: var(--pink-accent);
      box-shadow: 0 6px 0 var(--pink-accent);
    }

    .choices-grid-4 .choice-btn.selected {
      border-color: var(--pink-accent);
      box-shadow: 0 4px 0 var(--pink-accent);
    }

    /* ENG-ENG Type Input Field */
    .type-input-box {
      margin-top: clamp(20px, 5dvh, 46px);
      width: 100%;
      max-width: 340px;
      height: 54px;
      border-radius: 40px;
      background-color: var(--surface-btn);
      border: 3px solid var(--border-grey);
      box-shadow: 0 4px 0 var(--border-grey);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7px 0 20px;
      cursor: text;
    }

    .type-text-display {
      flex: 1;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-white);
    }

    .type-caret {
      display: inline-block;
      width: 3px;
      height: 25px;
      background-color: var(--pink-accent);
      margin-left: 3px;
      animation: caretBlink 1s steps(1) infinite;
      flex-shrink: 0;
    }

    @keyframes caretBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .type-submit-btn {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background-color: var(--pink-accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.12s ease;
    }

    .type-submit-btn:active {
      transform: scale(0.9);
    }

    /* iOS-style On-Screen Keyboard for ENG-ENG Type */
    .ios-keyboard {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: clamp(260px, 36dvh, 310px);
      background: rgba(173, 179, 188, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 26px 26px 0 0;
      padding: 12px 4px 10px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    .kb-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 0 4px;
    }

    .kb-key {
      height: clamp(38px, 5dvh, 43px);
      min-width: 28px;
      flex: 1;
      max-width: 38px;
      background-color: #ffffff;
      border: none;
      border-radius: 8.5px;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      font-size: 22px;
      font-weight: 400;
      color: #4a4a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .kb-key:active {
      background-color: #d6d8dd;
      transform: scale(0.96);
    }

    .kb-key.kb-wide {
      max-width: 48px;
      min-width: 40px;
      flex: 1.3;
    }

    .kb-key.kb-abc {
      max-width: 96px;
      flex: 2.2;
      font-size: 16px;
      font-weight: 500;
    }

    .kb-key.kb-space {
      max-width: 210px;
      flex: 5;
    }

    .kb-key.kb-return {
      max-width: 96px;
      flex: 2.2;
      background-color: #0088ff;
      color: #ffffff;
    }

    .kb-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 28px 6px 28px;
      color: #4f5666;
    }

    /* Slide to Next Slider */
    .slide-next-wrap {
      position: absolute;
      left: 36px;
      right: 36px;
      max-width: 340px;
      margin: 0 auto;
      bottom: clamp(28px, 7dvh, 61px);
      height: 71.5px;
      border-radius: 68px;
      background-color: var(--surface-btn);
      border: 3px solid var(--border-grey);
      box-shadow: 0 4px 0 var(--border-grey);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 8;
    }

    .slide-next-label {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-light);
      margin-left: 34px;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .slide-next-thumb {
      position: absolute;
      left: -1.5px;
      top: -3px;
      width: 71.5px;
      height: 71.5px;
      border-radius: 50%;
      background-color: var(--pink-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide-next-thumb.dragging {
      transition: none;
      cursor: grabbing;
    }

    /* Check Bottom Sheet (5:799 / 5:777) */
    .check-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .check-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .check-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 280px;
      background-color: var(--bg-dark);
      border-radius: 55px 55px 0 0;
      box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.55);
      padding: 31px 28px 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      z-index: 55;
      transform: translateY(105%);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .check-sheet.open {
      transform: translateY(0);
    }

    .check-status-title {
      font-family: 'MPLUS1-Black', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: var(--text-light);
      line-height: 35px;
      text-align: center;
    }

    .check-status-title.wrong {
      color: var(--pink-accent);
    }

    .check-answer-word {
      font-family: 'ABCGintoDiscordNord', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--text-light);
      text-align: center;
      line-height: 1.25;
      margin-top: 4px;
      word-break: break-word;
    }

    .check-answer-sub {
      font-family: 'MPLUS1-Bold', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-light);
      text-align: center;
      line-height: 1.45;
      margin-top: 6px;
      max-width: 330px;
    }

    .check-next-btn {
      margin-top: 18px;
      width: 162.1px;
      height: 58.7px;
      border-radius: 55.8px;
      background-color: var(--surface-btn);
      border: 3px solid var(--border-grey);
      box-shadow: 0 4px 0 var(--border-grey);
      font-family: 'MPLUS1-Bold', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .check-next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--border-grey);
    }

    /* Quit Confirmation Modal (5:763 / 14:411) */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 13.5px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .quit-modal-card {
      width: 366px;
      max-width: 100%;
      min-height: 249px;
      background-color: var(--bg-dark);
      border-radius: 40px;
      padding: 51px 16px 27px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
      animation: modalPop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalPop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .quit-modal-text {
      padding: 0 29px;
      font-family: 'MPLUS1-Bold', sans-serif;
      font-size: 22.95px;
      font-weight: 700;
      color: var(--text-light);
      line-height: 1.44;
      text-align: left;
    }

    .quit-modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      margin-top: 32px;
    }

    .quit-modal-btn {
      flex: 1;
      max-width: 162.1px;
      height: 58.7px;
      border-radius: 55.8px;
      background-color: var(--surface-btn);
      border: 3px solid var(--border-grey);
      box-shadow: 0 4px 0 var(--border-grey);
      font-family: 'MPLUS1-Bold', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .quit-modal-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--border-grey);
    }

    /* Name Edit Modal */
    .name-input-field {
      width: 100%;
      height: 48px;
      border-radius: 24px;
      background-color: var(--surface-btn);
      border: 3px solid var(--border-grey);
      color: var(--text-white);
      font-family: 'ABCGintoDiscordNord', 'MPLUS1-Bold', sans-serif;
      font-size: 18px;
      padding: 0 18px;
      outline: none;
      margin-top: 14px;
      user-select: text;
      -webkit-user-select: text;
    }

    .name-input-field:focus {
      border-color: var(--pink-accent);
    }

    /* Subtle mode toast pill */
    .mode-toast {
      position: absolute;
      top: clamp(82px, 13.5dvh, 112px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'ABCGintoDiscordNord', 'MPLUS1-Bold', sans-serif;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .mode-toast.show {
      opacity: 0.92;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <!-- Pre-bundled CSV & JSON fallback data for static file:// execution -->
  <script src="./data.js"></script>
  <script>
    (() => {
      'use strict';

      /* =========================================================================
       * 1. STATE & STORAGE MANAGEMENT
       * ========================================================================= */
      const STORAGE_KEY = 'vocx_dojo_app_state_v2';
      const LEGACY_STORAGE_KEY = 'vocx_dojo_app_state_v1';

      const defaultState = {
        face: 'vocx',          // 'vocx' | 'dojo'
        activeTab: 'home',     // 'home' | 'mypage'
        profileName: '@Name',
        settings: {
          initialHint: true,
          skipSlide: false,    // Must default to false so Slide to Next is required before revealing the answer
          soundEffects: true   // Enabled by default for ./se/ audio files
        },
        // Unit progress per face:
        // vocxProgress[unitId] = { clearedModes: { 'jpn-eng': bool, 'eng-select': bool, 'eng-type': bool }, bestScorePct: number, pausedSession: null | {...} }
        vocxProgress: {},
        dojoProgress: {}
      };

      let appState = loadState();
      let vocxUnitsData = Object.assign({}, window.VOCX_FALLBACK_DATA || {});
      let dojoUnitsData = Object.assign({}, window.DOJO_FALLBACK_DATA || {});
      let currentSession = null;
      let isShifted = false;

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            return {
              ...structuredClone(defaultState),
              ...parsed,
              settings: { ...defaultState.settings, ...(parsed.settings || {}) },
              vocxProgress: parsed.vocxProgress || {},
              dojoProgress: parsed.dojoProgress || {}
            };
          }
          // Migrate progress from v1 if present, while resetting skipSlide=false & soundEffects=true
          const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
          if (legacyRaw) {
            const legacy = JSON.parse(legacyRaw);
            const migrated = {
              ...structuredClone(defaultState),
              face: legacy.face || 'vocx',
              activeTab: legacy.activeTab || 'home',
              profileName: legacy.profileName || '@Name',
              settings: {
                initialHint: legacy.settings && typeof legacy.settings.initialHint === 'boolean'
                  ? legacy.settings.initialHint
                  : true,
                skipSlide: false,
                soundEffects: true
              },
              vocxProgress: legacy.vocxProgress || {},
              dojoProgress: legacy.dojoProgress || {}
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }
          return structuredClone(defaultState);
        } catch (e) {
          return structuredClone(defaultState);
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        } catch (e) {
          // Ignore quota errors
        }
      }

      /* =========================================================================
       * 2. SOUND EFFECTS FROM ./se/ FOLDER
       * ========================================================================= */
      const SE_FILES = {
        tap: './se/button.wav',
        slide: './se/Slide.wav',
        correct: './se/correct.wav',
        wrong: './se/incorrect.wav',
        complete: './se/correct.wav'
      };

      const preloadedAudio = {};
      Object.entries(SE_FILES).forEach(([key, src]) => {
        try {
          const a = new Audio(src);
          a.preload = 'auto';
          preloadedAudio[key] = a;
        } catch (e) {
          // Ignore preload errors
        }
      });

      function playSound(type) {
        if (!appState.settings.soundEffects) return;
        try {
          const src = SE_FILES[type] || SE_FILES.tap;
          const baseAudio = preloadedAudio[type];
          if (baseAudio) {
            const sound = baseAudio.cloneNode();
            sound.volume = 0.85;
            sound.play().catch(() => {});
          } else {
            const sound = new Audio(src);
            sound.volume = 0.85;
            sound.play().catch(() => {});
          }
        } catch (e) {
          // Ignore audio errors
        }
      }

      /* =========================================================================
       * 3. CSV & JSON DYNAMIC LOADER (with fallback to data.js)
       * ========================================================================= */
      function parseCSVText(text) {
        const rows = [];
        let cur = '';
        let inQuotes = false;
        let row = [];
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          const next = text[i + 1];
          if (ch === '"') {
            if (inQuotes && next === '"') {
              cur += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            row.push(cur);
            cur = '';
          } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
            if (ch === '\r' && next === '\n') i++;
            row.push(cur);
            cur = '';
            if (row.length >= 4 && row[0].trim()) {
              rows.push({
                word: row[0].trim(),
                jpn: row[1].trim(),
                def: row[2].trim(),
                sentence: row[3].trim(),
                inflected: row[4] ? row[4].trim() : ''
              });
            }
            row = [];
          } else {
            cur += ch;
          }
        }
        if (cur || row.length > 0) {
          row.push(cur);
          if (row.length >= 4 && row[0].trim()) {
            rows.push({
              word: row[0].trim(),
              jpn: row[1].trim(),
              def: row[2].trim(),
              sentence: row[3].trim(),
              inflected: row[4] ? row[4].trim() : ''
            });
          }
        }
        return rows;
      }

      async function tryFetchLiveFiles() {
        if (window.location.protocol === 'file:') return;
        const unitPromises = [];
        for (let i = 1; i <= 27; i++) {
          const id = String(i).padStart(2, '0');
          unitPromises.push(
            fetch(`./vocx/${id}.csv`)
              .then(r => (r.ok ? r.text() : null))
              .then(txt => {
                if (txt) {
                  const parsed = parseCSVText(txt);
                  if (parsed.length > 0) vocxUnitsData[id] = parsed;
                }
              })
              .catch(() => {})
          );
        }
        const dojoPaths = [
          { unit: '01', part: 'part1', url: './dojo/unit1/part1.json' },
          { unit: '01', part: 'part2', url: './dojo/unit1/part2.json' },
          { unit: '02', part: 'part1', url: './dojo/Unit2/part1.json' },
          { unit: '02', part: 'part2', url: './dojo/Unit2/part2.json' }
        ];
        dojoPaths.forEach(({ unit, part, url }) => {
          unitPromises.push(
            fetch(url)
              .then(r => (r.ok ? r.json() : null))
              .then(json => {
                if (json) {
                  if (!dojoUnitsData[unit]) dojoUnitsData[unit] = {};
                  dojoUnitsData[unit][part] = json;
                }
              })
              .catch(() => {})
          );
        });
        await Promise.all(unitPromises);
        renderHomeUnits();
      }

      /* =========================================================================
       * 4. UI HELPERS & BADGE SVGS
       * ========================================================================= */
      const CHECK_BADGE_SVG = `
        <svg class="unit-badge" width="31" height="31" viewBox="0 0 33 33" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16.5" cy="16.5" r="15" fill="#5BF067" stroke="#2C2C2C" stroke-width="3"/>
          <path d="M23 13L14.75 21.25L11 17.5" stroke="#2C2C2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;

      const PAUSE_BADGE_SVG = `
        <svg class="unit-badge" width="31" height="31" viewBox="0 0 33 33" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16.5" cy="16.5" r="15" fill="#FF9696" stroke="#2C2C2C" stroke-width="3"/>
          <path d="M14 22V11M18.7143 22V11" stroke="#2C2C2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;

      let toastTimer = null;
      function showToast(msg) {
        const el = document.getElementById('mode-toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
      }

      function capitalizeFirst(str) {
        if (!str) return '';
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      /* =========================================================================
       * 5. HOME SCREEN & UNIT STATUS COMPUTATION
       * ========================================================================= */
      function getUnitEvaluation(face, unitId) {
        const progMap = face === 'vocx' ? appState.vocxProgress : appState.dojoProgress;
        const entry = progMap[unitId];
        if (!entry) {
          return { status: 'untried', label: 'Untried', badge: '' };
        }
        if (entry.pausedSession) {
          return { status: 'paused', label: 'Paused', badge: PAUSE_BADGE_SVG };
        }
        const cleared = entry.clearedModes || {};
        const clearedCount = Object.values(cleared).filter(Boolean).length;
        const requiredModes = face === 'vocx' ? 3 : 2;
        const bestPct = entry.bestScorePct ?? 0;

        if (clearedCount >= requiredModes && bestPct === 100) {
          return { status: 'marvelous', label: 'Marvelous!', badge: CHECK_BADGE_SVG };
        }
        if (bestPct === 100) {
          return {
            status: 'perfect',
            label: 'Perfect!',
            badge: clearedCount >= requiredModes ? CHECK_BADGE_SVG : ''
          };
        }
        if (clearedCount > 0) {
          return { status: 'nice', label: 'Nice!', badge: '' };
        }
        return { status: 'untried', label: 'Untried', badge: '' };
      }

      function renderHomeUnits() {
        const listEl = document.getElementById('units-list');
        const titleBtn = document.getElementById('app-title-btn');
        titleBtn.textContent = appState.face === 'vocx' ? 'Vocx' : 'Dojo';

        const unitIds = appState.face === 'vocx'
          ? Object.keys(vocxUnitsData).sort((a, b) => Number(a) - Number(b))
          : Object.keys(dojoUnitsData).sort((a, b) => Number(a) - Number(b));

        const rowsHtml = unitIds.map(unitId => {
          const evalInfo = getUnitEvaluation(appState.face, unitId);
          return `
            <div class="unit-row" data-unit="${unitId}" data-status="${evalInfo.status}">
              <div class="unit-circle-wrap" data-role="circle" data-unit="${unitId}">
                <div class="unit-circle-shadow"></div>
                <div class="unit-circle-main">
                  <span class="unit-circle-num">${unitId}</span>
                </div>
                ${evalInfo.badge}
              </div>
              <div class="unit-info-wrap" data-role="unit-text" data-unit="${unitId}">
                <div class="unit-title-text">Unit ${unitId}</div>
                <div class="unit-status-text">${evalInfo.label}</div>
              </div>
            </div>
          `;
        }).join('');

        listEl.innerHTML = `<div class="timeline-line"></div>${rowsHtml}`;
        bindUnitRowGestures(listEl);
      }

      /* Single Tap vs Long Press Gesture Binding on Unit Circle and Unit Title */
      function bindUnitRowGestures(container) {
        const targets = container.querySelectorAll('[data-role="circle"], [data-role="unit-text"]');
        const LONG_PRESS_MS = 450;

        targets.forEach(el => {
          let timer = null;
          let startX = 0;
          let startY = 0;
          let longPressed = false;
          let pointerActive = false;

          const clearGesture = () => {
            if (timer) {
              clearTimeout(timer);
              timer = null;
            }
            el.classList.remove('pressing');
            pointerActive = false;
          };

          el.addEventListener('pointerdown', e => {
            if (e.button && e.button !== 0) return;
            pointerActive = true;
            longPressed = false;
            startX = e.clientX;
            startY = e.clientY;
            el.classList.add('pressing');

            timer = setTimeout(() => {
              if (!pointerActive) return;
              longPressed = true;
              el.classList.remove('pressing');
              el.classList.add('long-triggered');
              setTimeout(() => el.classList.remove('long-triggered'), 350);
              if (navigator.vibrate) navigator.vibrate(25);
              playSound('tap');
              handleUnitTrigger(el.dataset.unit, el.dataset.role, true);
            }, LONG_PRESS_MS);
          });

          el.addEventListener('pointermove', e => {
            if (!pointerActive) return;
            if (Math.hypot(e.clientX - startX, e.clientY - startY) > 10) {
              clearGesture();
            }
          });

          el.addEventListener('pointerup', () => {
            if (!pointerActive) return;
            const wasLong = longPressed;
            clearGesture();
            if (!wasLong) {
              playSound('tap');
              handleUnitTrigger(el.dataset.unit, el.dataset.role, false);
            }
          });

          el.addEventListener('pointercancel', clearGesture);
          el.addEventListener('contextmenu', e => e.preventDefault());
        });
      }

      function handleUnitTrigger(unitId, role, isLongPress) {
        const progMap = appState.face === 'vocx' ? appState.vocxProgress : appState.dojoProgress;
        const unitEntry = progMap[unitId] || {};

        if (appState.face === 'vocx') {
          let targetMode = 'jpn-eng';
          if (role === 'circle' && !isLongPress) {
            targetMode = 'jpn-eng';
          } else if (role === 'circle' && isLongPress) {
            targetMode = 'eng-select';
          } else if (role === 'unit-text' && isLongPress) {
            targetMode = 'eng-type';
          } else if (role === 'unit-text' && !isLongPress) {
            targetMode = unitEntry.pausedSession ? unitEntry.pausedSession.mode : 'jpn-eng';
          }

          if (unitEntry.pausedSession && (!isLongPress || unitEntry.pausedSession.mode === targetMode)) {
            resumePausedSession(unitEntry.pausedSession);
            return;
          }
          startVocxQuiz(unitId, targetMode);
        } else {
          const targetPart = isLongPress ? 'part2' : 'part1';
          if (unitEntry.pausedSession && (!isLongPress || unitEntry.pausedSession.mode === targetPart)) {
            resumePausedSession(unitEntry.pausedSession);
            return;
          }
          startDojoQuiz(unitId, targetPart);
        }
      }

      /* =========================================================================
       * 6. QUESTION BUILDERS FOR VOCX & DOJO
       * ========================================================================= */
      function buildBlankedSentence(sentence, word, inflected, showInitialHint) {
        const candidates = [];
        if (inflected && inflected.trim()) candidates.push(inflected.trim());
        if (word && word.trim()) candidates.push(word.trim());

        for (const target of candidates) {
          const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(`\\b${escaped}\\b`, 'i');
          const match = sentence.match(regex) || sentence.match(new RegExp(escaped, 'i'));
          if (match) {
            const matchedStr = match[0];
            const replacement = showInitialHint
              ? `${matchedStr.charAt(0)}_____`
              : '______';
            return sentence.replace(matchedStr, replacement);
          }
        }
        return sentence;
      }

      function sanitizeDefinitionForType(defText, word, inflected) {
        if (!defText) return '';
        let result = defText;
        const candidates = [];
        if (inflected && inflected.trim()) candidates.push(inflected.trim());
        if (word && word.trim()) candidates.push(word.trim());
        for (const target of candidates) {
          const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(`\\b${escaped}\\b`, 'gi');
          result = result.replace(regex, '_____');
        }
        return result;
      }

      function startVocxQuiz(unitId, mode) {
        const rows = vocxUnitsData[unitId];
        if (!rows || rows.length === 0) return;

        const shuffledRows = shuffleArray(rows);
        const questions = shuffledRows.map(item => {
          const distractors = shuffleArray(
            rows.filter(r => r.word.toLowerCase() !== item.word.toLowerCase())
          ).slice(0, 3);

          if (mode === 'jpn-eng') {
            const choices = shuffleArray([
              capitalizeFirst(item.word),
              ...distractors.map(d => capitalizeFirst(d.word))
            ]);
            const answerIndex = choices.findIndex(
              c => c.toLowerCase() === item.word.toLowerCase()
            );
            return {
              kind: 'vocx-jpn-eng',
              prompt: item.jpn,
              choices,
              answerIndex,
              wordDisplay: capitalizeFirst(item.word),
              subDisplay: item.jpn,
              rawItem: item
            };
          } else if (mode === 'eng-select') {
            const distractorWords = distractors.map(d => capitalizeFirst(d.word));
            const correctLabel = capitalizeFirst(item.inflected ? item.inflected : item.word);
            const choices = shuffleArray([correctLabel, ...distractorWords]);
            const answerIndex = choices.indexOf(correctLabel);
            return {
              kind: 'vocx-eng-select',
              prompt: buildBlankedSentence(item.sentence, item.word, item.inflected, false),
              choices,
              answerIndex,
              wordDisplay: capitalizeFirst(item.word),
              subDisplay: item.jpn,
              rawItem: item
            };
          } else {
            // eng-type
            return {
              kind: 'vocx-eng-type',
              defText: sanitizeDefinitionForType(item.def, item.word, item.inflected),
              acceptedAnswers: [
                item.word.toLowerCase(),
                ...(item.inflected ? [item.inflected.toLowerCase()] : [])
              ],
              wordDisplay: capitalizeFirst(item.word),
              subDisplay: item.jpn,
              rawItem: item
            };
          }
        });

        const modeLabel = mode === 'jpn-eng'
          ? 'JPN-ENG'
          : mode === 'eng-select'
            ? 'ENG-ENG Select'
            : 'ENG-ENG Type';
        showToast(modeLabel);

        currentSession = {
          face: 'vocx',
          unitId,
          mode,
          questions,
          currentIndex: 0,
          correctCount: 0,
          selectedChoice: null,
          typedText: '',
          answeredCurrent: false
        };
        openQuizScreen();
      }

      function stripLeadingQuestionNumber(text) {
        return text
          .replace(/^\d+\.\s*/, '')
          .replace(/^A:\s*/i, '')
          .replace(/\s*\/\s*B:\s*_+\s*$/i, '')
          .trim();
      }

      function startDojoQuiz(unitId, part) {
        const unitObj = dojoUnitsData[unitId];
        if (!unitObj || !unitObj[part]) return;
        const quizData = unitObj[part];
        const questions = [];

        if (part === 'part1') {
          const sec1 = (quizData.sections || []).find(s => s.type === 'matching');
          const sec2 = (quizData.sections || []).find(s => s.type === 'choice');

          if (sec1 && sec1.questions) {
            const allWords = Array.from(
              new Set(
                (sec1.options || [])
                  .filter(w => w && w !== '未解答')
                  .concat(sec1.questions.map(q => q.answer))
              )
            );
            const pickedVocab = shuffleArray(sec1.questions).slice(0, 5);
            pickedVocab.forEach(q => {
              const distractors = shuffleArray(
                allWords.filter(w => w.toLowerCase() !== q.answer.toLowerCase())
              ).slice(0, 3);
              const choices = shuffleArray([q.answer, ...distractors]);
              questions.push({
                kind: 'dojo-voc',
                prompt: stripLeadingQuestionNumber(q.text),
                choices,
                answerIndex: choices.indexOf(q.answer),
                wordDisplay: q.answer,
                subDisplay: q.explanation || '',
                rawItem: q
              });
            });
          }

          if (sec2 && sec2.questions) {
            const pickedChoice = shuffleArray(sec2.questions).slice(0, 5);
            pickedChoice.forEach(q => {
              const pairs = q.choices.map((c, idx) => ({ text: c, isCorrect: idx === q.answer }));
              const shuffledPairs = shuffleArray(pairs);
              const answerIndex = shuffledPairs.findIndex(p => p.isCorrect);
              questions.push({
                kind: 'dojo-answer',
                prompt: stripLeadingQuestionNumber(q.text).replace(/_{3,}/g, '_____'),
                choices: shuffledPairs.map(p => p.text),
                answerIndex,
                wordDisplay: shuffledPairs[answerIndex].text,
                subDisplay: q.explanation || '',
                rawItem: q
              });
            });
          }
        } else {
          // part2 (PDF phrasal verbs)
          const sec1 = (quizData.sections || [])[0];
          if (sec1 && sec1.questions) {
            const picked = shuffleArray(sec1.questions).slice(0, 10);
            picked.forEach(q => {
              const pairs = q.choices.map((c, idx) => ({
                text: capitalizeFirst(c),
                isCorrect: idx === q.answer
              }));
              const shuffledPairs = shuffleArray(pairs);
              const answerIndex = shuffledPairs.findIndex(p => p.isCorrect);
              questions.push({
                kind: 'dojo-phrasal',
                prompt: stripLeadingQuestionNumber(q.text).replace(/_{3,}/g, '_____'),
                choices: shuffledPairs.map(p => p.text),
                answerIndex,
                wordDisplay: shuffledPairs[answerIndex].text,
                subDisplay: q.explanation || '',
                rawItem: q
              });
            });
          }
        }

        showToast(part === 'part1' ? 'Dojo Part 1' : 'Dojo Part 2');
        currentSession = {
          face: 'dojo',
          unitId,
          mode: part,
          questions,
          currentIndex: 0,
          correctCount: 0,
          selectedChoice: null,
          typedText: '',
          answeredCurrent: false
        };
        openQuizScreen();
      }

      function resumePausedSession(savedSession) {
        currentSession = structuredClone(savedSession);
        currentSession.answeredCurrent = false;
        showToast('Resumed');
        openQuizScreen();
      }

      /* =========================================================================
       * 7. QUIZ SCREEN RENDERING & INTERACTION
       * ========================================================================= */
      function openQuizScreen() {
        document.getElementById('screen-main').classList.remove('active');
        document.getElementById('screen-quiz').classList.add('active');
        const sheet = document.getElementById('quiz-sheet');
        sheet.style.transform = 'translateY(0px)';
        closeCheckSheet();
        renderCurrentQuestion();
      }

      function closeQuizScreen() {
        closeCheckSheet();
        document.getElementById('screen-quiz').classList.remove('active');
        document.getElementById('screen-main').classList.add('active');
        currentSession = null;
        renderHomeUnits();
      }

      function updateProgressBar() {
        if (!currentSession) return;
        const total = Math.max(1, currentSession.questions.length);
        const ratio = Math.min(1, Math.max(0, (currentSession.currentIndex + 1) / total));
        const trackEl = document.getElementById('quiz-progress-track');
        const trackWidth = (trackEl && trackEl.clientWidth) ? trackEl.clientWidth : 235;
        const thumbSize = 22;
        const fillWidth = Math.max(thumbSize, Math.round(thumbSize + (trackWidth - thumbSize) * ratio));
        const thumbLeft = fillWidth - thumbSize;

        document.getElementById('quiz-progress-fill').style.width = `${fillWidth}px`;
        document.getElementById('quiz-progress-thumb').style.left = `${thumbLeft}px`;
        document.getElementById('quiz-unit-num').textContent = currentSession.unitId;
      }

      window.addEventListener('resize', () => {
        if (currentSession) {
          updateProgressBar();
        }
      });

      function renderCurrentQuestion() {
        if (!currentSession) return;
        updateProgressBar();
        closeCheckSheet();
        resetSlideThumb();

        const q = currentSession.questions[currentSession.currentIndex];
        currentSession.selectedChoice = null;
        currentSession.typedText = '';
        currentSession.answeredCurrent = false;

        const contentEl = document.getElementById('quiz-content');
        const slideWrap = document.getElementById('slide-next-wrap');
        const keyboardEl = document.getElementById('ios-keyboard');

        if (q.kind === 'vocx-eng-type') {
          slideWrap.style.display = 'none';
          keyboardEl.style.display = 'flex';
          const raw = q.rawItem;
          const sentenceText = buildBlankedSentence(
            raw.sentence,
            raw.word,
            raw.inflected,
            appState.settings.initialHint
          );
          const safeDef = sanitizeDefinitionForType(q.defText || raw.def, raw.word, raw.inflected);
          contentEl.innerHTML = `
            <div class="quiz-prompt-type-wrap">
              <div class="quiz-prompt-type-sentence">${escapeHtml(sentenceText)}</div>
              <div class="quiz-prompt-type-def">${escapeHtml(safeDef)}</div>
            </div>
            <div id="type-input-box" class="type-input-box">
              <div class="type-text-display">
                <span id="type-typed-span"></span>
                <span class="type-caret"></span>
              </div>
              <button id="type-submit-btn" class="type-submit-btn" type="button" aria-label="Submit Answer">
                <svg width="10" height="12" viewBox="0 0 10 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5 11V1M9 4.75L5 1L1 4.75" stroke="#2C2C2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          `;
          document.getElementById('type-submit-btn').addEventListener('click', () => {
            submitTypeAnswer();
          });
        } else {
          keyboardEl.style.display = 'none';
          slideWrap.style.display = 'flex';

          let promptClass = 'quiz-prompt-jpn';
          let choicesClass = 'choices-stack-4';

          if (q.kind === 'vocx-jpn-eng') {
            promptClass = 'quiz-prompt-jpn';
            choicesClass = 'choices-stack-4';
          } else if (q.kind === 'vocx-eng-select' || q.kind === 'dojo-voc') {
            promptClass = 'quiz-prompt-eng-select';
            choicesClass = 'choices-grid-4';
          } else if (q.kind === 'dojo-answer') {
            promptClass = 'quiz-prompt-dojo-stack';
            choicesClass = 'choices-stack-3';
          } else if (q.kind === 'dojo-phrasal') {
            promptClass = 'quiz-prompt-dojo-stack';
            choicesClass = 'choices-stack-2';
          }

          const promptFontSize =
            q.prompt.length > 85 ? 'font-size: 20px;' :
            q.prompt.length > 60 ? 'font-size: 23px;' : '';

          const buttonsHtml = q.choices.map((choiceText, idx) => `
            <button type="button" class="choice-btn" data-choice-index="${idx}">
              ${escapeHtml(choiceText)}
            </button>
          `).join('');

          contentEl.innerHTML = `
            <div class="${promptClass}" style="${promptFontSize}">${escapeHtml(q.prompt)}</div>
            <div class="${choicesClass}">
              ${buttonsHtml}
            </div>
          `;

          contentEl.querySelectorAll('.choice-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              if (currentSession.answeredCurrent) return;
              const idx = Number(btn.dataset.choiceIndex);
              currentSession.selectedChoice = idx;
              contentEl.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
              btn.classList.add('selected');

              // Only reveal the answer immediately if the user explicitly enabled "スライドをスキップ".
              // By default (skipSlide = false), the user must slide "Slide to Next" to approve.
              if (appState.settings.skipSlide) {
                confirmChoiceAnswer();
              } else {
                playSound('tap');
              }
            });
          });
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function confirmChoiceAnswer() {
        if (!currentSession || currentSession.answeredCurrent) return;
        if (currentSession.selectedChoice === null) return;

        currentSession.answeredCurrent = true;
        const q = currentSession.questions[currentSession.currentIndex];
        const isCorrect = currentSession.selectedChoice === q.answerIndex;
        if (isCorrect) {
          currentSession.correctCount++;
          playSound('correct');
        } else {
          playSound('wrong');
        }
        openCheckSheet(isCorrect, q.wordDisplay, q.subDisplay);
      }

      function submitTypeAnswer() {
        if (!currentSession || currentSession.answeredCurrent) return;
        const q = currentSession.questions[currentSession.currentIndex];
        if (q.kind !== 'vocx-eng-type') return;
        const typed = currentSession.typedText.trim().toLowerCase();
        if (!typed) return;

        currentSession.answeredCurrent = true;
        const isCorrect = q.acceptedAnswers.includes(typed);
        if (isCorrect) {
          currentSession.correctCount++;
          playSound('correct');
        } else {
          playSound('wrong');
        }
        openCheckSheet(isCorrect, q.wordDisplay, q.subDisplay);
      }

      function openCheckSheet(isCorrect, wordText, subText) {
        const titleEl = document.getElementById('check-status-title');
        const wordEl = document.getElementById('check-answer-word');
        const subEl = document.getElementById('check-answer-sub');

        titleEl.textContent = isCorrect ? 'すごい！' : 'おしい！';
        titleEl.classList.toggle('wrong', !isCorrect);
        wordEl.textContent = wordText;
        subEl.textContent = subText;

        document.getElementById('check-backdrop').classList.add('open');
        document.getElementById('check-sheet').classList.add('open');
      }

      function closeCheckSheet() {
        document.getElementById('check-backdrop').classList.remove('open');
        document.getElementById('check-sheet').classList.remove('open');
      }

      function advanceToNextQuestion() {
        if (!currentSession) return;
        playSound('tap');
        closeCheckSheet();

        if (currentSession.currentIndex + 1 < currentSession.questions.length) {
          currentSession.currentIndex++;
          renderCurrentQuestion();
        } else {
          finishQuizSession();
        }
      }

      function finishQuizSession() {
        if (!currentSession) return;
        playSound('complete');
        const { face, unitId, mode, correctCount, questions } = currentSession;
        const scorePct = Math.round((correctCount / Math.max(1, questions.length)) * 100);
        const progMap = face === 'vocx' ? appState.vocxProgress : appState.dojoProgress;

        const existing = progMap[unitId] || { clearedModes: {}, bestScorePct: 0, pausedSession: null };
        existing.clearedModes = existing.clearedModes || {};
        existing.clearedModes[mode] = true;
        existing.bestScorePct = Math.max(existing.bestScorePct || 0, scorePct);
        existing.pausedSession = null;
        progMap[unitId] = existing;

        saveState();
        closeQuizScreen();
      }

      /* =========================================================================
       * 8. SLIDE TO NEXT GESTURE & SLIDE DOWN TO PAUSE GESTURE
       * ========================================================================= */
      const slideWrap = document.getElementById('slide-next-wrap');
      const slideThumb = document.getElementById('slide-next-thumb');
      let slideDragging = false;
      let slideStartX = 0;
      let slideCurrentX = 0;
      let slideSoundPlayed = false;

      function getMaxSlideX() {
        const wrapWidth = (slideWrap && slideWrap.clientWidth) ? slideWrap.clientWidth : 313;
        const thumbWidth = (slideThumb && slideThumb.offsetWidth) ? slideThumb.offsetWidth : 71.5;
        return Math.max(80, wrapWidth - thumbWidth + 2);
      }

      function resetSlideThumb() {
        slideDragging = false;
        slideCurrentX = 0;
        slideSoundPlayed = false;
        slideThumb.classList.remove('dragging');
        slideThumb.style.transform = 'translateX(0px)';
      }

      slideThumb.addEventListener('pointerdown', e => {
        if (!currentSession || currentSession.answeredCurrent) return;
        if (currentSession.selectedChoice === null) {
          showToast('選択肢を選んでください');
          return;
        }
        slideDragging = true;
        slideSoundPlayed = false;
        slideStartX = e.clientX - slideCurrentX;
        slideThumb.classList.add('dragging');
        slideThumb.setPointerCapture(e.pointerId);
      });

      slideThumb.addEventListener('pointermove', e => {
        if (!slideDragging) return;
        const maxSlideX = getMaxSlideX();
        slideCurrentX = Math.max(0, Math.min(maxSlideX, e.clientX - slideStartX));
        if (!slideSoundPlayed && slideCurrentX > 14) {
          slideSoundPlayed = true;
          playSound('slide');
        }
        slideThumb.style.transform = `translateX(${slideCurrentX}px)`;
      });

      function endSlideDrag() {
        if (!slideDragging) return;
        slideDragging = false;
        slideThumb.classList.remove('dragging');
        const maxSlideX = getMaxSlideX();
        if (slideCurrentX >= maxSlideX * 0.62) {
          slideThumb.style.transform = `translateX(${maxSlideX}px)`;
          confirmChoiceAnswer();
        } else {
          resetSlideThumb();
        }
      }

      slideThumb.addEventListener('pointerup', endSlideDrag);
      slideThumb.addEventListener('pointercancel', endSlideDrag);

      /* Slide Down Quiz Sheet to Pause & Save Progress */
      const quizSheet = document.getElementById('quiz-sheet');
      let sheetDragging = false;
      let sheetStartY = 0;
      let sheetDeltaY = 0;

      quizSheet.addEventListener('pointerdown', e => {
        if (!currentSession) return;
        if (e.target.closest('button, .slide-next-wrap, .ios-keyboard, .type-input-box')) return;
        sheetDragging = true;
        sheetStartY = e.clientY;
        sheetDeltaY = 0;
        quizSheet.classList.add('dragging');
      });

      window.addEventListener('pointermove', e => {
        if (!sheetDragging) return;
        const dy = e.clientY - sheetStartY;
        sheetDeltaY = Math.max(0, dy);
        quizSheet.style.transform = `translateY(${sheetDeltaY}px)`;
      });

      function endSheetDrag() {
        if (!sheetDragging) return;
        sheetDragging = false;
        quizSheet.classList.remove('dragging');
        if (sheetDeltaY > 95 && currentSession) {
          // Slide down & save as Paused!
          quizSheet.style.transform = 'translateY(100%)';
          const { face, unitId } = currentSession;
          const progMap = face === 'vocx' ? appState.vocxProgress : appState.dojoProgress;
          const existing = progMap[unitId] || { clearedModes: {}, bestScorePct: 0, pausedSession: null };
          existing.pausedSession = structuredClone(currentSession);
          progMap[unitId] = existing;
          saveState();
          playSound('slide');
          setTimeout(() => {
            closeQuizScreen();
          }, 220);
        } else {
          quizSheet.style.transform = 'translateY(0px)';
        }
      }

      window.addEventListener('pointerup', endSheetDrag);
      window.addEventListener('pointercancel', endSheetDrag);

      /* =========================================================================
       * 9. VIRTUAL & PHYSICAL KEYBOARD FOR ENG-ENG TYPE
       * ========================================================================= */
      function updateTypedDisplay() {
        const span = document.getElementById('type-typed-span');
        if (span && currentSession) {
          span.textContent = currentSession.typedText;
        }
      }

      function handleKeyInput(key) {
        if (!currentSession || currentSession.answeredCurrent) return;
        const q = currentSession.questions[currentSession.currentIndex];
        if (!q || q.kind !== 'vocx-eng-type') return;

        if (key === 'BACKSPACE') {
          currentSession.typedText = currentSession.typedText.slice(0, -1);
          playSound('tap');
          updateTypedDisplay();
        } else if (key === 'ENTER') {
          submitTypeAnswer();
        } else if (key === 'SHIFT') {
          playSound('tap');
          isShifted = !isShifted;
          document.querySelectorAll('#ios-keyboard .kb-key[data-key]').forEach(btn => {
            const k = btn.dataset.key;
            if (k.length === 1 && /[a-z]/i.test(k)) {
              btn.textContent = isShifted ? k.toUpperCase() : k.toLowerCase();
            }
          });
        } else if (key === 'ABC') {
          playSound('tap');
        } else if (key.length === 1) {
          const ch = isShifted ? key.toUpperCase() : key;
          if (currentSession.typedText.length < 28) {
            currentSession.typedText += ch;
            isShifted = false;
            document.querySelectorAll('#ios-keyboard .kb-key[data-key]').forEach(btn => {
              const k = btn.dataset.key;
              if (k.length === 1 && /[a-z]/i.test(k)) {
                btn.textContent = k.toLowerCase();
              }
            });
            playSound('tap');
            updateTypedDisplay();
          }
        }
      }

      document.querySelectorAll('#ios-keyboard .kb-key').forEach(btn => {
        btn.addEventListener('click', () => {
          handleKeyInput(btn.dataset.key);
        });
      });

      window.addEventListener('keydown', e => {
        if (document.getElementById('name-modal').classList.contains('open')) {
          if (e.key === 'Enter') saveProfileName();
          return;
        }
        if (!currentSession) return;
        if (document.getElementById('check-sheet').classList.contains('open')) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            advanceToNextQuestion();
          }
          return;
        }
        const q = currentSession.questions[currentSession.currentIndex];
        if (q && q.kind === 'vocx-eng-type') {
          if (e.key === 'Backspace') {
            e.preventDefault();
            handleKeyInput('BACKSPACE');
          } else if (e.key === 'Enter') {
            e.preventDefault();
            handleKeyInput('ENTER');
          } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            handleKeyInput(e.key);
          }
        }
      });

      /* =========================================================================
       * 10. TOP TITLE FACE SWITCHING, NAVIGATION, SETTINGS & MODALS
       * ========================================================================= */
      const appTitleBtn = document.getElementById('app-title-btn');
      appTitleBtn.addEventListener('click', () => {
        playSound('slide');
        appState.face = appState.face === 'vocx' ? 'dojo' : 'vocx';
        saveState();
        appTitleBtn.classList.remove('flip-anim');
        void appTitleBtn.offsetWidth;
        appTitleBtn.classList.add('flip-anim');
        renderHomeUnits();
      });

      function switchTab(tab, withSound = true) {
        if (withSound) playSound('tap');
        appState.activeTab = tab;
        saveState();
        const isHome = tab === 'home';
        document.getElementById('tab-home').style.display = isHome ? 'block' : 'none';
        document.getElementById('tab-mypage').style.display = isHome ? 'none' : 'flex';
        document.getElementById('icon-home-active').style.display = isHome ? 'block' : 'none';
        document.getElementById('icon-home-inactive').style.display = isHome ? 'none' : 'block';
        document.getElementById('icon-mypage-active').style.display = isHome ? 'none' : 'block';
        document.getElementById('icon-mypage-inactive').style.display = isHome ? 'block' : 'none';
      }

      document.getElementById('nav-home-btn').addEventListener('click', () => switchTab('home', true));
      document.getElementById('nav-mypage-btn').addEventListener('click', () => switchTab('mypage', true));

      /* Mypage Settings Toggles */
      function syncSettingsUI() {
        document.getElementById('profile-name').textContent = appState.profileName || '@Name';
        const hintBtn = document.getElementById('toggle-hint');
        const skipBtn = document.getElementById('toggle-skip-slide');
        const soundBtn = document.getElementById('toggle-sound');

        hintBtn.classList.toggle('on', !!appState.settings.initialHint);
        hintBtn.setAttribute('aria-checked', String(!!appState.settings.initialHint));

        skipBtn.classList.toggle('on', !!appState.settings.skipSlide);
        skipBtn.setAttribute('aria-checked', String(!!appState.settings.skipSlide));

        soundBtn.classList.toggle('on', !!appState.settings.soundEffects);
        soundBtn.setAttribute('aria-checked', String(!!appState.settings.soundEffects));
      }

      document.getElementById('toggle-hint').addEventListener('click', () => {
        appState.settings.initialHint = !appState.settings.initialHint;
        saveState();
        syncSettingsUI();
        playSound('tap');
      });

      document.getElementById('toggle-skip-slide').addEventListener('click', () => {
        appState.settings.skipSlide = !appState.settings.skipSlide;
        saveState();
        syncSettingsUI();
        playSound('tap');
      });

      document.getElementById('toggle-sound').addEventListener('click', () => {
        appState.settings.soundEffects = !appState.settings.soundEffects;
        saveState();
        syncSettingsUI();
        playSound('tap');
      });

      /* Profile Name Editing */
      const nameModal = document.getElementById('name-modal');
      const nameInput = document.getElementById('name-input-field');

      function openNameModal() {
        playSound('tap');
        nameInput.value = appState.profileName || '@Name';
        nameModal.classList.add('open');
        setTimeout(() => nameInput.focus(), 50);
      }

      function saveProfileName() {
        const val = nameInput.value.trim();
        if (val) {
          appState.profileName = val.startsWith('@') ? val : `@${val}`;
          saveState();
          syncSettingsUI();
        }
        nameModal.classList.remove('open');
        playSound('tap');
      }

      document.getElementById('profile-edit-btn').addEventListener('click', openNameModal);
      document.getElementById('profile-name').addEventListener('click', openNameModal);
      document.getElementById('name-save-btn').addEventListener('click', saveProfileName);
      document.getElementById('name-cancel-btn').addEventListener('click', () => {
        nameModal.classList.remove('open');
        playSound('tap');
      });

      /* Quit Confirmation Modal (X Button discards progress) */
      const quitModal = document.getElementById('quit-modal');
      document.getElementById('quiz-close-btn').addEventListener('click', () => {
        playSound('tap');
        quitModal.classList.add('open');
      });

      document.getElementById('quit-confirm-no').addEventListener('click', () => {
        playSound('tap');
        quitModal.classList.remove('open');
      });

      document.getElementById('quit-confirm-yes').addEventListener('click', () => {
        playSound('tap');
        quitModal.classList.remove('open');
        if (currentSession) {
          const { face, unitId } = currentSession;
          const progMap = face === 'vocx' ? appState.vocxProgress : appState.dojoProgress;
          if (progMap[unitId] && progMap[unitId].pausedSession) {
            progMap[unitId].pausedSession = null;
            saveState();
          }
        }
        closeQuizScreen();
      });

      document.getElementById('check-next-btn').addEventListener('click', advanceToNextQuestion);

      /* Initialize */
      syncSettingsUI();
      switchTab(appState.activeTab || 'home', false);
      renderHomeUnits();
      tryFetchLiveFiles();
    })();
  </script>
</body>
