<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vocx" />
  <meta name="theme-color" content="#11232c" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./sys/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./sys/apple-touch-icon.png" />
  <title>Vocx &amp; Dojo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet" />
  <!-- Font Awesome Classic Free. Etch requires a Pro+ Kit. -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./ui.css" />
</head>
<body>
  <div id="ios-blur-fix" class="ios-blur-fix" aria-hidden="true"></div>
  <div id="phone-viewport">
    <!-- Mode Toast Indicator -->
    <div id="mode-toast" class="mode-toast"></div>

    <!-- ==================== HOME & MYPAGE LAYER ==================== -->
    <div id="screen-main" class="screen active">
      <!-- Top Header (Tap to toggle Vocx / Dojo) -->
      <header class="app-header">
        <div class="face-tabs" role="group" aria-label="学習コンテンツ">
          <button id="face-vocx-btn" class="face-tab" type="button" aria-pressed="true">Vocx</button>
          <button id="face-dojo-btn" class="face-tab" type="button" aria-pressed="false">Dojo</button>
        </div>
      </header>

      <!-- Home Tab View -->
      <main id="tab-home" class="units-scroll">
        <div id="units-list" class="units-list">
          <div class="timeline-line"></div>
          <!-- Populated dynamically -->
        </div>
      </main>

      <div id="units-hint-up" class="units-scroll-hint units-scroll-hint-up" aria-hidden="true" hidden><i class="fa-solid fa-chevron-up"></i></div>
      <div id="units-hint-down" class="units-scroll-hint units-scroll-hint-down" aria-hidden="true" hidden><i class="fa-solid fa-chevron-down"></i></div>

      <!-- Mypage Tab View -->
      <main id="tab-mypage" class="mypage-body" style="display: none;">
        <div class="mypage-card">
          <div class="profile-row">
            <div class="profile-avatar-wrap">
              <div id="profile-avatar" class="profile-avatar"></div>
              <button id="profile-edit-btn" class="profile-edit-btn" type="button" aria-label="Edit Profile Name">
                <svg width="23" height="23" viewBox="0 0 27 27" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="13.5" cy="13.5" r="13.5" fill="#FFF5F5"/>
                  <path d="M8.2204 17.3448C8.24733 17.1025 8.26079 16.9813 8.29745 16.8681C8.32998 16.7676 8.37594 16.672 8.43409 16.5838C8.49963 16.4844 8.58584 16.3982 8.75826 16.2258L16.4985 8.48554C17.1459 7.83815 18.1955 7.83815 18.8429 8.48554C19.4903 9.13293 19.4903 10.1826 18.8429 10.83L11.1027 18.5702C10.9302 18.7426 10.844 18.8288 10.7446 18.8943C10.6565 18.9525 10.5608 18.9984 10.4604 19.031C10.3471 19.0676 10.2259 19.0811 9.98358 19.108L8 19.3284L8.2204 17.3448Z" stroke="black" stroke-width="1.1722" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <div id="profile-name" class="profile-name">@Name</div>
          </div>

          <div class="settings-list">
            <div class="setting-row">
              <span class="setting-label">頭文字ヒント</span>
              <button id="toggle-hint" class="toggle-switch on" type="button" role="switch" aria-label="頭文字ヒント" aria-checked="true">
                <span class="toggle-thumb"></span>
              </button>
            </div>
            <div class="setting-row">
              <span class="setting-label">サウンドエフェクト</span>
              <button id="toggle-sound" class="toggle-switch on" type="button" role="switch" aria-label="サウンドエフェクト" aria-checked="true">
                <span class="toggle-thumb"></span>
              </button>
            </div>
          </div>
        </div>
      </main>

      <!-- Bottom Navigation Bar -->
      <footer class="bottom-footer">
        <button id="nav-home-btn" class="nav-btn" type="button" aria-label="Home">
          <i id="icon-home-active" class="fa-solid fa-house" aria-hidden="true"></i>
          <i id="icon-home-inactive" class="fa-solid fa-house" aria-hidden="true" style="display:none;"></i>
          <span class="nav-label">ホーム</span>
        </button>

        <button id="nav-mypage-btn" class="nav-btn" type="button" aria-label="Profile">
          <i id="icon-mypage-inactive" class="fa-regular fa-user" aria-hidden="true"></i>
          <i id="icon-mypage-active" class="fa-solid fa-user" aria-hidden="true" style="display:none;"></i>
          <span class="nav-label">マイページ</span>
        </button>
      </footer>
    </div>

    <!-- ==================== QUIZ SCREEN LAYER ==================== -->
    <div id="screen-quiz" class="screen">
      <!-- Topbar: Close X, Progress Slider, Unit Number -->
      <div class="quiz-topbar">
        <button id="quiz-close-btn" class="quiz-close-btn" type="button" aria-label="Quit Quiz">
          <svg width="20" height="20" viewBox="0 0 27 27" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24.7499 2.25001L2.24995 24.75M2.24995 2.25001L24.7499 24.75" stroke="#2C2C2C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div id="quiz-progress-track" class="quiz-progress-track">
          <div id="quiz-progress-fill" class="quiz-progress-fill"></div>
          <div id="quiz-progress-thumb" class="quiz-progress-thumb"></div>
        </div>

        <div class="quiz-unit-meta"><div id="quiz-unit-num" class="quiz-unit-num">01</div><div id="quiz-study-time" class="quiz-study-time" aria-label="この問題の経過時間">00:00</div></div>
      </div>

      <!-- Main Quiz Dark Sheet (Slide down to pause & save) -->
      <div id="quiz-sheet" class="quiz-sheet">
        <div id="quiz-pause-handle" class="quiz-pause-handle-area" title="下にスライドして一時停止">
          <div class="quiz-pause-pill"></div>
        </div>

        <div id="quiz-content" class="quiz-content">
          <!-- Populated dynamically per question -->
        </div>

      </div>

      <!-- Check Bottom Sheet (5:799 / 5:777) -->
      <div id="check-backdrop" class="check-backdrop"></div>
      <div id="check-sheet" class="check-sheet">
        <svg class="check-result-symbol" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="result-circle" cx="50" cy="50" r="36" />
          <path class="result-cross" d="M25 25L75 75M75 25L25 75" />
        </svg>
        <div id="check-status-title" class="check-status-title" role="status" aria-live="polite"></div>
        <div id="check-answer-word" class="check-answer-word">Agreement</div>
        <div id="check-answer-sub" class="check-answer-sub">合意・契約</div>
        <button id="check-next-btn" class="check-next-btn" type="button">進む</button>
      </div>
    </div>

    <section id="screen-results" class="screen results-screen" aria-labelledby="results-title">
      <h1 id="results-title" tabindex="-1"></h1>
      <div id="results-percent" class="results-percent"></div>
      <p id="results-score"></p>
      <p id="results-time"></p>
      <div id="results-mistakes"></div>
      <button id="results-home" class="check-next-btn" type="button">ホームへ戻る</button>
    </section>
    <div id="results-hint-down" class="units-scroll-hint results-scroll-hint" aria-hidden="true" hidden><i class="fa-solid fa-chevron-down"></i></div>

    <!-- ==================== QUIT CONFIRMATION MODAL (5:763 / 14:411) ==================== -->
    <div id="quit-modal" class="modal-overlay">
      <div class="quit-modal-card">
        <div class="quit-modal-text quit-confirm-text">終了しますか？<span class="quit-modal-description">一時停止すると続きから再開できます</span></div>
        <div class="quit-modal-actions quiz-quit-actions">
          <button id="quit-confirm-pause" class="quit-modal-btn" type="button">一時停止して終了</button>
          <button id="quit-confirm-yes" class="quit-modal-btn" type="button">破棄して終了</button>
          <button id="quit-confirm-no" class="quit-modal-btn" type="button">続ける</button>
        </div>
      </div>
    </div>

    <!-- ==================== PROFILE NAME EDIT MODAL ==================== -->
    <div id="name-modal" class="modal-overlay">
      <div class="quit-modal-card" style="min-height: 230px; padding-top: 36px;">
        <div class="quit-modal-text" style="font-size: 20px;">ユーザー名を変更</div>
        <div style="padding: 0 20px;">
          <input id="name-input-field" class="name-input-field" type="text" maxlength="20" placeholder="@Name" />
        </div>
        <div class="quit-modal-actions">
          <button id="name-save-btn" class="quit-modal-btn" type="button">保存</button>
          <button id="name-cancel-btn" class="quit-modal-btn" type="button">キャンセル</button>
        </div>
      </div>
    </div>
  </div>

  <dialog id="unit-mode-dialog" class="unit-mode-dialog" aria-labelledby="unit-mode-title unit-mode-description">
    <div class="mode-sheet-grip" aria-hidden="true"><span></span></div>
    <div class="mode-dialog-header">
      <h2 id="unit-mode-title">Unit</h2>
      <button id="unit-mode-close" class="mode-close" type="button" aria-label="Close">×</button>
    </div>
    <p id="unit-mode-description">モードを選択</p>
    <div id="unit-mode-options" class="mode-options"></div>
  </dialog>

  <!-- Pre-bundled CSV & JSON fallback data for static file:// execution -->
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
